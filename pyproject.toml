[project]
name = "tally-ai"
version = "0.1.0"
description = "Natural-language (English / Hinglish) voucher entry for Tally, powered by LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "langchain-core>=0.3.30",
    "langchain-ollama>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=1.2.12",
    "rapidfuzz>=3.14.6",
    "pdfplumber>=0.11",
]

[project.scripts]
tally-ai = "tally_ai.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally_ai"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to a real Tally server (set TALLY_LIVE=1 to enable)",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["app", "main.py", "tests/live/tally_voucher_probe.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic apostrophe is matched on purpose (Lay’s == Lay's)
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
# Synthetic invoice text must keep the PDF's long single-line rows
"tests/unit/purchase_fixtures.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_ollama.*", "langchain_google_genai.*", "langchain_openai.*"]
ignore_missing_imports = true
